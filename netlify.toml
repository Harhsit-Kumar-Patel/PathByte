[build]
  # Navigate to frontend, install with the fix flag, then build
  command = "cd frontend && npm install --legacy-peer-deps && npm run build"
  publish = "frontend/dist"
  base = "/"

[build.environment]
  NODE_VERSION = "20.19.0"
  # This environment variable also helps npm handle the conflict globally
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
